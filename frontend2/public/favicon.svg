<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
>
  <defs>
    <linearGradient
      id="vgit-grad"
      x1="80"
      y1="120"
      x2="430"
      y2="150"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#8B2BE2" />
      <stop offset="25%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#0091FF" />
      <stop offset="100%" stop-color="#00C0FF" />
    </linearGradient>
  </defs>

  <!-- Left Branch -->
  <line
    x1="120"
    y1="140"
    x2="256"
    y2="400"
    stroke="url(#vgit-grad)"
    stroke-width="54"
    stroke-linecap="round"
  />

  <!-- Right Branch -->
  <polyline
    points="256,400 340,275 415,155"
    stroke="url(#vgit-grad)"
    stroke-width="54"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Left Node Ring -->
  <circle
    cx="120"
    cy="140"
    r="58"
    fill="#0d1117"
    stroke="url(#vgit-grad)"
    stroke-width="32"
  />

  <!-- Bottom Node Ring -->
  <circle
    cx="256"
    cy="400"
    r="58"
    fill="#0d1117"
    stroke="url(#vgit-grad)"
    stroke-width="32"
  />

  <!-- Mid-Right Node Ring -->
  <circle
    cx="340"
    cy="275"
    r="44"
    fill="#0d1117"
    stroke="url(#vgit-grad)"
    stroke-width="26"
  />

  <!-- Top-Right Node Ring -->
  <circle
    cx="415"
    cy="155"
    r="58"
    fill="#0d1117"
    stroke="url(#vgit-grad)"
    stroke-width="32"
  />
</svg>